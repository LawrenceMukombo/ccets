version: '3.8'

services:
  frontend:
    build: .
    container_name: ccets_frontend
    ports:
      - "80:80"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: ccets_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_change_me_in_prod
      POSTGRES_DB: png_ccets
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    container_name: ccets_backend
    ports:
      - "5050:5050"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password_change_me_in_prod
      - DB_NAME=png_ccets
      - JWT_SECRET=super_secret_jwt_key_change_me
    depends_on:
      - db

  sync_service:
    build:
      context: .
      dockerfile: Dockerfile.sync
    container_name: ccets_sync
    # Run once and exit, or run periodically if wrapped in loop/cron
    # For now, it runs on startup
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password_change_me_in_prod
      - DB_NAME=png_ccets


volumes:
  postgres_data:
